name: Build and Release Juaris

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate and Make Gradle Wrapper Executable
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper not found, generating it via gradle-command..."
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x ./gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $GITHUB_WORKSPACE/juaris-release-key.jks

      # INTELLIGENTE XML-DEDUPLIZIERUNG (Sprach-Erhaltend für alle 12 Sprachen)
      - name: Intelligente XML-Deduplizierung für alle 12 Sprachen (Python-Kernel)
        run: |
          python3 -c '
          import xml.etree.ElementTree as ET
          import glob
          import re

          for path in glob.glob("app/src/main/res/**/strings.xml", recursive=True):
              try:
                  parser = ET.XMLParser(target=ET.TreeBuilder(insert_comments=True))
                  tree = ET.parse(path, parser=parser)
                  root = tree.getroot()
                  
                  seen_names = set()
                  new_children = []
                  duplicates_found = 0

                  for child in root:
                      if child.tag == "string":
                          name = child.attrib.get("name")
                          if name in seen_names:
                              duplicates_found += 1
                              continue # Doppeltes Element verwerfen, Original-Übersetzung behalten
                          seen_names.add(name)
                      new_children.append(child)

                  if duplicates_found > 0:
                      root[:] = new_children
                      # KORREKTUR: Erzwingt ein sauberes Schreiben ohne Verlust von Android-Kaufmanns-Und Maskierungen (&amp;)
                      tree.write(path, encoding="utf-8", xml_declaration=True)
                      
                      # Nachbearbeitung um maskierte Hochkommata in Lokalisierungen absolut sicher zu erhalten
                      with open(path, "r", encoding="utf-8") as f:
                          content = f.read()
                      content = content.replace("&amp;amp;", "&amp;")
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(content)
                          
                      print(f"🟢 Bereinigt: {path} ({duplicates_found} Duplikate entfernt)")
                  else:
                      print(f"⚪ Keine Duplikate in: {path}")
              except Exception as e:
                  print(f"❌ Fehler beim Verarbeiten von {path}: {e}")
          '

      - name: Run Android Lint (Statische Code-Analyse)
        run: |
          echo "Scanne den Code nach Fehlern und Problemen..."
          ./gradlew lintRelease --stacktrace

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juaris-lint-results
          path: app/build/reports/lint-results*

      - name: Run Unit Tests
        run: |
          echo "Führe Unit-Tests aus..."
          ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juaris-unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Build Both AAB and APK
        run: |
          echo "kompiliere APK und AAB mit 3GB Heap..."
          ./gradlew assembleRelease bundleRelease --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3g" \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=false \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/juaris-release-key.jks" \
            -Pandroid.injected.signing.storePassword="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.keyAlias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.keyPassword="${{ secrets.KEY_PASSWORD }}"

      - name: Release Both Files
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app/build/outputs/bundle/release/**/*.aab
            app/build/outputs/apk/release/**/*.apk
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Juaris Release v1.0.0-${{ github.run_number }} (AAB & APK)"
          body: "Dieses Release enthält sowohl die .aab-Datei für den Google Play Store als auch die .apk-Datei zum direkten Installieren auf dem Handy."
          token: ${{ secrets.GITHUB_TOKEN }}
