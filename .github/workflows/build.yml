name: Build and Release Juaris

on:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $GITHUB_WORKSPACE/juaris-release-key.jks

      - name: Download Gradle 8.4
        run: |
          echo "Lade Gradle 8.4 herunter..."
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip

      - name: Run Android Lint (Statische Code-Analyse)
        run: |
          echo "Scanne den Code nach Fehlern und Problemen..."
          ./gradle-8.4/bin/gradle lintRelease --stacktrace

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juaris-lint-results
          path: app/build/reports/lint-results*

      - name: Run Unit Tests
        run: |
          echo "Führe Unit-Tests aus..."
          ./gradle-8.4/bin/gradle testDebugUnitTest --stacktrace

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juaris-unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Run Instrumented Tests (UI & System)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -gpu auto -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradle-8.4/bin/gradle connectedAndroidTest --stacktrace

      - name: Build Both AAB and APK
        run: |
          echo "kompiliere APK und AAB mit 3GB Heap..."
          ./gradle-8.4/bin/gradle assembleRelease bundleRelease --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3g" \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/juaris-release-key.jks" \
            -Pandroid.injected.signing.store-password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key_alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key_password="${{ secrets.KEY_PASSWORD }}"

      - name: Release Both Files
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Juaris Release v1.0.0-${{ github.run_number }} (AAB & APK)"
          body: "Dieses Release enthält sowohl die .aab-Datei für den Google Play store als auch die .apk-Datei zum direkten Installieren auf dem Handy."
          token: ${{ secrets.GITHUB_TOKEN }}


