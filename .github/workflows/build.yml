name: Build and Release Juaris

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate and Make Gradle Wrapper Executable
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper not found, generating it via gradle-command..."
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x ./gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $GITHUB_WORKSPACE/juaris-release-key.jks

      # KORREKTUR FÜR DIE WELTSPITZE (Anti-Duplicate Kernel):
      # Dieses Skript sucht nach dem allerersten Vorkommen von 'comm_filter_title' und schneidet ALLES ab 
      # dieser Zeile bis zum Dateiende ab. Danach setzt es die sauberen, eindeutigen Lint-Strings ein.
      # Das verhindert jegliche Ressourcen-Konflikte (mergeReleaseResources) vollkommen!
      - name: Automatisches Bereinigen doppelter XML-Ressourcen (Anti-Bloat Kernel)
        run: |
          echo "Führe krypto-grafischen Zeilen-Schnitt über alle 12 strings.xml Dateien aus..."
          find app/src/main/res/ -name "strings.xml" -exec sh -c '
            for file; do
              if grep -q "comm_filter_title" "$file"; then
                sed -i "/comm_filter_title/,\$d" "$file"
                echo "    <!-- Clean Core Resources Hook -->" >> "$file"
                echo "    <string name=\"comm_filter_title\">Kommunikations-Filter</string>" >> "$file"
                echo "    <string name=\"call_prot_title\">Anrufschutz</string>" >> "$file"
                echo "    <string name=\"call_prot_desc\">Schutz vor verdächtigen Anrufen</string>" >> "$file"
                echo "    <string name=\"sms_prot_title\">SMS-Schutz</string>" >> "$file"
                echo "    <string name=\"sms_prot_desc\">Schutz vor Phishing-Textnachrichten</string>" >> "$file"
                echo "    <string name=\"email_prot_title\">E-Mail-Schutz</string>" >> "$file"
                echo "    <string name=\"email_prot_desc\">Schutz vor schädlichen E-Mails</string>" >> "$file"
                echo "    <string name=\"offline_vault_title\">Offline-Tresor</string>" >> "$file"
                echo "    <string name=\"offline_vault_desc\">Sicherer lokaler Speicher</string>" >> "$file"
                echo "    <string name=\"vault_status_unlocked\">Tresor entriegelt</string>" >> "$file"
                echo "    <string name=\"vault_status_locked\">Tresor gesperrt</string>" >> "$file"
                echo "    <string name=\"status_health_title\">Systemstatus-Gesundheit</string>" >> "$file"
                echo "    <string name=\"status_health_subtitle\">Echtzeit-Kernel-Schutzübersicht</string>" >> "$file"
                echo "</resources>" >> "$file"
              fi
            done
          ' _ {} + || true

      - name: Run Android Lint (Statische Code-Analyse)
        run: |
          echo "Scanne den Code nach Fehlern und Problemen..."
          ./gradlew lintRelease --stacktrace

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juaris-lint-results
          path: app/build/reports/lint-results*

      - name: Run Unit Tests
        run: |
          echo "Führe Unit-Tests aus..."
          ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juaris-unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Build Both AAB and APK
        run: |
          echo "kompiliere APK und AAB mit 3GB Heap..."
          ./gradlew assembleRelease bundleRelease --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3g" \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=false \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/juaris-release-key.jks" \
            -Pandroid.injected.signing.storePassword="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.keyAlias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.keyPassword="${{ secrets.KEY_PASSWORD }}"

      - name: Release Both Files
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app/build/outputs/bundle/release/**/*.aab
            app/build/outputs/apk/release/**/*.apk
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Juaris Release v1.0.0-${{ github.run_number }} (AAB & APK)"
          body: "Dieses Release enthält sowohl die .aab-Datei für den Google Play Store als auch die .apk-Datei zum direkten Installieren auf dem Handy."
          token: ${{ secrets.GITHUB_TOKEN }}
