name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          items: platforms;android-34,build-tools;34.0.0

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Generate Complete LocalShield App & Build
        run: |
          mkdir -p app/src/main/java/com/example/localshield

          # 1. AndroidManifest.xml mit Systemrechten für den CallScreeningService
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="LocalShield"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  
                  <service
                      android:name=".ScamCallScreeningService"
                      android:permission="android.permission.BIND_SCREENING_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.telecom.CallScreeningService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          # 2. Echter, funktionsfähiger Service mit Offline-Prüfung
          cat << 'EOF' > app/src/main/java/com/example/localshield/ScamCallScreeningService.kt
          package com.example.localshield

          import android.telecom.Call
          import android.telecom.CallScreeningService

          class ScamCallScreeningService : CallScreeningService() {

              override fun onScreenCall(callDetails: Call.Details) {
                  // Nur eingehende Anrufe prüfen
                  if (callDetails.callDirection == Call.Details.DIRECTION_INCOMING) {
                      val phoneNumber = callDetails.handle?.schemeSpecificPart ?: ""
                      
                      // Hier findet die lokale Prüfung statt (vollkommen offline)
                      val isScam = checkLocalBlacklist(phoneNumber)

                      val response = CallScreeningService.CallResponse.Builder()
                          .setDisallowCall(isScam) // Anruf blockieren, falls Scam
                          .setRejectCall(isScam) // Direkt auflegen
                          .setSkipCallLog(isScam) // Optional: Aus Anrufliste ausschließen
                          .setSkipNotification(isScam) // Klingeln unterdrücken
                          .build()

                      respondToCall(callDetails, response)
                  }
              }

              private fun checkLocalBlacklist(number: String): Boolean {
                  // Platzhalter für deine spätere lokale Datenbank (z.B. Room oder SQLite)
                  // Testweise blockieren wir Nummern mit bestimmten Test-Präfixen
                  val localBlacklist = listOf("+43999", "+49999", "0900")
                  return localBlacklist.any { number.startsWith(it) }
              }
          }
          EOF

          # 3. Gradle Settings
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LocalShield"
          include(":app")
          EOF

          # 4. Root Build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF

          # 5. App Build.gradle.kts mit allen nötigen Abhängigkeiten
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.localshield"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.localshield"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF

          # 6. Gradle herunterladen und ausführen
          echo "Lade Gradle 8.2 herunter..."
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          
          echo "Starte Build..."
          ./gradle-8.2/bin/gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: localshield-apk
          path: app/build/outputs/apk/debug/app-debug.apk

