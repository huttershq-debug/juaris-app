name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          items: platforms;android-34,build-tools;34.0.0

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Generate Project & Build with AndroidX Support
        run: |
          mkdir -p app/src/main/java/com/example/localshield

          # 1. SDK-Pfad für Gradle hinterlegen
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # 2. WICHTIG: AndroidX und Jetifier aktivieren (Genau das hat Gradle verlangt!)
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # 3. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="LocalShield">
                  <service
                      android:name=".ScamCallScreeningService"
                      android:permission="android.permission.BIND_SCREENING_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.telecom.CallScreeningService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          # 4. ScamCallScreeningService.kt
          cat << 'EOF' > app/src/main/java/com/example/localshield/ScamCallScreeningService.kt
          package com.example.localshield

          import android.telecom.Call
          import android.telecom.CallScreeningService

          class ScamCallScreeningService : CallScreeningService() {
              override fun onScreenCall(callDetails: Call.Details) {
                  if (callDetails.callDirection == Call.Details.DIRECTION_INCOMING) {
                      val phoneNumber = callDetails.handle?.schemeSpecificPart ?: ""
                      val isScam = phoneNumber.startsWith("+4399") || phoneNumber.startsWith("+4999")

                      val response = CallScreeningService.CallResponse.Builder()
                          .setDisallowCall(isScam)
                          .setRejectCall(isScam)
                          .setSkipCallLog(isScam)
                          .setSkipNotification(isScam)
                          .build()
                      respondToCall(callDetails, response)
                  }
              }
          }
          EOF

          # 5. Settings
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LocalShield"
          include(":app")
          EOF

          # 6. Root Build
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF

          # 7. App Build
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.localshield"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.localshield"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }

              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
          }
          EOF

          # 8. Gradle 8.4 herunterladen und starten
          echo "Lade Gradle 8.4 herunter..."
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.2-bin.zip 2>/dev/null || unzip -q gradle-8.4-bin.zip
          
          echo "Starte Build..."
          ./gradle-8.4/bin/gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: localshield-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Direkten Download-Link generieren
        run: |
          curl -L -F "file=@app/build/outputs/apk/debug/app-debug.apk" https://file.io
