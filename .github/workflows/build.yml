name: Build and Release Juaris AAB

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          items: platforms;android-34,build-tools;34.0.0

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Configure AndroidX in gradle.properties
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Decode Keystore
        run: |
          mkdir -p app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/app/juaris-release-key.jks"

      - name: Build Signed Release Bundle (AAB)
        run: |
          echo "Lade Gradle 8.4 herunter..."
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip 2>/dev/null || unzip -q gradle-8.4-bin.zip
          
          echo "Starte Release Build..."
          ./gradle-8.4/bin/gradle bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/app/juaris-release-key.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Release AAB veröffentlichen
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/bundle/release/app-release.aab
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Juaris Release v1.0.0-${{ github.run_number }}"
          body: "Automatisches Produktions-Release der Juaris-App."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

