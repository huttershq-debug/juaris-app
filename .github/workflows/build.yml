name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Complete Clean Project & Build
        run: |
          # Verzeichnisse erstellen
          mkdir -p app/src/main/java/com/example/localshield

          # 1. AndroidManifest.xml direkt fehlerfrei schreiben
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="LocalShield">
                  <service
                      android:name=".ScamCallScreeningService"
                      android:permission="android.permission.BIND_SCREENING_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.telecom.CallScreeningService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          # 2. ScamCallScreeningService.kt direkt fehlerfrei schreiben
          cat << 'EOF' > app/src/main/java/com/example/localshield/ScamCallScreeningService.kt
          package com.example.localshield

          import android.telecom.Call
          import android.telecom.CallScreeningService

          class ScamCallScreeningService : CallScreeningService() {
              override fun onScreenCall(callDetails: Call.Details) {
                  val response = CallResponse.Builder()
                      .setDisallowCall(false)
                      .setRejectCall(false)
                      .setSkipCallLog(false)
                      .setSkipNotification(false)
                      .build()
                  respondToCall(callDetails, response)
              }
          }
          EOF

          # 3. Gradle Settings
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LocalShield"
          include(":app")
          EOF

          # 4. Root Build.gradle.kts (Exakt kompatibel zu AGP 8.2.0)
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF

          # 5. App Build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.localshield"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.localshield"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
          }
          EOF

          # 6. Perfekt abgestimmtes Gradle 8.2 direkt herunterladen und ausführen
          echo "Lade Gradle 8.2 herunter..."
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          
          echo "Starte Build..."
          ./gradle-8.2/bin/gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: localshield-apk
          path: app/build/outputs/apk/debug/app-debug.apk
