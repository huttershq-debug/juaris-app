name: Build and Release Juaris

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Wrapper bereitstellen
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.13
          fi
          chmod +x ./gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Keystore dekodieren
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/juaris-release-key.jks"

      - name: Android Lint
        run: ./gradlew lintRelease --stacktrace

      - name: Lint-Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juaris-lint-results
          path: app/build/reports/lint-results*

      - name: Unit-Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: APK und AAB bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Release veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/bundle/release/**/*.aab
            app/build/outputs/apk/release/**/*.apk
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Juaris v1.0.0-${{ github.run_number }}"
          body: "AAB fuer den Play Store und APK zum direkten Installieren."
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keystore entfernen
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/juaris-release-key.jks"
