name: Build Android APK

on: [push]
permissions:
   contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          items: platforms;android-34,build-tools;34.0.0

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Generate Project & Build with AndroidX Support
        run: |
          mkdir -p app/src/main/java/com/juaris/app

          # 1. SDK-Pfad für Gradle hinterlegen
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # 2. WICHTIG: AndroidX und Jetifier aktivieren
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # 4. ScamCallScreeningService.kt
          cat << 'EOF' > app/src/main/java/com/juaris/app/ScamCallScreeningService.kt
          package com.juaris.app

          import android.telecom.Call
          import android.telecom.CallScreeningService

          class ScamCallScreeningService : CallScreeningService() {
              override fun onScreenCall(callDetails: Call.Details) {
                  if (callDetails.callDirection == Call.Details.DIRECTION_INCOMING) {
                      val phoneNumber = callDetails.handle?.schemeSpecificPart ?: ""
                      val isScam = phoneNumber.startsWith("+4399") || phoneNumber.startsWith("+4999")

                      val response = CallScreeningService.CallResponse.Builder()
                          .setDisallowCall(isScam)
                          .setRejectCall(isScam)
                          .setSkipCallLog(isScam)
                          .setSkipNotification(isScam)
                          .build()
                      respondToCall(callDetails, response)
                  }
              }
          }
          EOF

          # 5. Settings
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Juaris"
          include(":app")
          EOF

          # 6. Root Build
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF

          # 7. App Build (JETZT MIT VERSIONCODE 5!)
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.juaris.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.juaris.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 5
                  versionName = "5.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }

              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
          }
          EOF

          # 8. Gradle 8.4 herunterladen und starten
          echo "Lade Gradle 8.4 herunter..."
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.2-bin.zip 2>/dev/null || unzip -q gradle-8.4-bin.zip
         
          echo "Starte Build..."
          ./gradle-8.4/bin/gradle clean assembleDebug --stacktrace

      - name: Release APK veröffentlichen
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: v1.0.0-${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
