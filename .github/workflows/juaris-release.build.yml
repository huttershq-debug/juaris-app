name: Build Both AAB and APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Quellcode laden
      uses: actions/checkout@v4

    - name: Java JDK 17 einrichten
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Gradle einrichten
      uses: gradle/actions/setup-gradle@v3

    - name: Release-Keystore direkt im app-Ordner erstellen
      run: |
        keytool -genkey -v \
          -keystore app/juaris-release-key.jks \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -alias juaris-alias \
          -dname "CN=Juaris, OU=Dev, O=Juaris, L=Local, S=Local, C=AT" \
          -storepass juarispassword -keypass juarispassword

    - name: Gradle Wrapper ausführbar machen
      run: chmod +x gradlew

    - name: AAB und APK bauen
      run: ./gradlew bundleRelease assembleRelease --no-daemon -Pandroid.injected.signing.store.file=app/juaris-release-key.jks -Pandroid.injected.signing.store.password=juarispassword -Pandroid.injected.signing.key.alias=juaris-alias -Pandroid.injected.signing.key.password=juarispassword

    - name: Artefakte hochladen
      uses: actions/upload-artifact@v4
      with:
        name: juaris-production-binaries
        path: |
          app/build/outputs/bundle/release/*.aab
          app/build/outputs/apk/release/*.apk


