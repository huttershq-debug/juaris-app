plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.juaris.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.juaris.app"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            storeFile file("$rootProject.rootDir/juaris-release-key.jks")
            storePassword = findProperty("android.injected.signing.storePassword") ?: findProperty("storePassword") ?: System.getenv("KEYSTORE_PASSWORD")
            keyAlias = findProperty("android.injected.signing.keyAlias") ?: findProperty("keyAlias") ?: System.getenv("KEY_ALIAS")
            keyPassword = findProperty("android.injected.signing.keyPassword") ?: findProperty("keyPassword") ?: System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            // Bewusst aus: R8 kann nicht auf echten Geraeten getestet werden. Nach dem Release separat einfuehren.
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    // Lint-Bericht wird weiterhin erzeugt und hochgeladen, blockiert den Build aber nicht.
    lint {
        abortOnError false
        disable 'MissingTranslation', 'ExtraTranslation'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'com.google.android.material:material:1.12.0'

    implementation platform('androidx.compose:compose-bom:2025.06.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'

    implementation 'androidx.biometric:biometric:1.1.0'

    implementation 'androidx.room:room-runtime:2.7.1'
    implementation 'androidx.room:room-ktx:2.7.1'
    ksp 'androidx.room:room-compiler:2.7.1'

    // Neue, offiziell gepflegte SQLCipher-Bibliothek (16-KB-Seiten ab 4.6.1)
    implementation 'net.zetetic:sqlcipher-android:4.6.1@aar'

    implementation 'androidx.work:work-runtime-ktx:2.10.0'

    testImplementation 'junit:junit:4.13.2'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
